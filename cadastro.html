<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | BambuFocus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
   <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-body">

    <div class="app-card login-card">
        
        <header class="auth-header">
            <h2 class="auth-title">Crie sua conta</h2>
            <p class="auth-subtitle">Sua jornada de foco começa aqui.</p>
        </header>

        <form class="auth-form">
            
            <div class="input-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" placeholder="Como quer ser chamado?" required>
            </div>

            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="exemplo@email.com" required>
            </div>

            <div class="input-group">
                <label for="password">Crie uma Senha</label>
                <input type="password" id="password" placeholder="Mínimo de 8 caracteres" minlength="8" required>
            </div>

            <div class="form-options" style="margin-top: 10px; justify-content: center;">
                <label class="remember-me">
                    <input type="checkbox" required> Aceito os Termos de Uso e Política de Privacidade
                </label>
            </div>

            <button type="submit" class="btn-primary">Finalizar Cadastro</button>

        </form>

        <footer class="auth-footer" style="text-align: center;">
            <p>Já tem uma conta? <a href="login.html" class="signup-link">Entrar</a></p>
        </footer>

    </div>

</body>
</html>
